services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://site:site@postgres:5432/site_modeling
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
      EXPERIMENT_OUTPUT_ROOT: /app/outputs
    volumes:
      - ../outputs:/app/outputs
      - ../memory:/app/memory
      - ../data:/app/data:ro
      - ../scenes:/app/scenes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://site:site@postgres:5432/site_modeling
      REDIS_URL: redis://redis:6379/0
      EXPERIMENT_OUTPUT_ROOT: /app/outputs
    volumes:
      - ../outputs:/app/outputs
      - ../data:/app/data:ro
      - ../scenes:/app/scenes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure:5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: site
      POSTGRES_PASSWORD: site
      POSTGRES_DB: site_modeling
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U site -d site_modeling"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_data:
